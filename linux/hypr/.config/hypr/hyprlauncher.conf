# ~/.config/hypr/hyprlauncher.conf
# Colors and fonts are not set here: hyprlauncher follows hyprtoolkit.conf
# (Kanagawa Dragon + SauceCodePro Nerd Font Mono).
# https://wiki.hypr.land/Hypr-Ecosystem/hyprlauncher/

general {
  grab_focus = true
}

cache {
  # rank frequently used entries higher
  enabled = true
}

finders {
  default_finder = desktop
  desktop_icons = true
}

